<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FSC Ad Creative Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1C1C14;
    --olive: #4A4A2E;
    --olive-mid: #5C5C3D;
    --taupe: #B8AC9A;
    --sand: #D4C9B5;
    --cream: #F2EDE4;
    --gold: #C4A06A;
    --gold-light: #D9BC8E;
    --rust: #7A3B1E;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #13130E;
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    color: var(--cream);
    min-height: 100vh;
  }

  header {
    background: var(--ink);
    border-bottom: 1px solid rgba(196,160,106,0.15);
    padding: 20px 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    font-weight: 400;
    letter-spacing: 0.08em;
    color: var(--cream);
  }

  header h1 span { color: var(--gold); font-style: italic; }

  .header-tag {
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--taupe);
    border: 1px solid rgba(184,172,154,0.25);
    padding: 5px 12px;
    border-radius: 20px;
  }

  .main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 28px 80px;
  }

  /* CONTROLS */
  .controls {
    background: var(--ink);
    border: 1px solid rgba(196,160,106,0.12);
    border-radius: 12px;
    padding: 28px 32px;
    margin-bottom: 36px;
  }

  .controls-title {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .controls-title::before {
    content: '';
    display: block;
    width: 20px;
    height: 1px;
    background: var(--gold);
  }

  .controls-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 16px;
    align-items: end;
  }

  .ctrl-group label {
    display: block;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--taupe);
    margin-bottom: 8px;
  }

  .ctrl-group select,
  .ctrl-group input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(184,172,154,0.2);
    border-radius: 6px;
    padding: 10px 14px;
    color: var(--cream);
    font-family: 'Jost', sans-serif;
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.2s;
    appearance: none;
  }

  .ctrl-group select:focus,
  .ctrl-group input:focus {
    border-color: var(--gold);
  }

  .ctrl-group select option { background: var(--ink); }

  .generate-btn {
    background: var(--gold);
    color: var(--ink);
    border: none;
    border-radius: 6px;
    padding: 11px 28px;
    font-family: 'Jost', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s, transform 0.15s;
    height: 42px;
  }

  .generate-btn:hover { background: var(--gold-light); transform: translateY(-1px); }
  .generate-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* AD SETS */
  .offer-section {
    margin-bottom: 48px;
  }

  .offer-heading {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(184,172,154,0.12);
  }

  .offer-badge {
    background: var(--olive-mid);
    color: var(--gold-light);
    font-size: 0.68rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 2px;
  }

  .offer-heading h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 400;
    color: var(--cream);
  }

  .platform-label {
    margin-left: auto;
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--taupe);
  }

  .ads-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .ad-card {
    background: var(--ink);
    border: 1px solid rgba(184,172,154,0.1);
    border-radius: 10px;
    overflow: hidden;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .ad-card.visible { opacity: 1; transform: translateY(0); }

  .ad-card-header {
    background: rgba(255,255,255,0.03);
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(184,172,154,0.08);
  }

  .ad-platform {
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .ad-type {
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--taupe);
  }

  .ad-body { padding: 20px 18px; }

  .ad-section-label {
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--olive-mid);
    margin-bottom: 6px;
    margin-top: 16px;
  }

  .ad-section-label:first-child { margin-top: 0; }

  .ad-text {
    font-size: 0.88rem;
    line-height: 1.7;
    color: var(--sand);
    white-space: pre-wrap;
  }

  .ad-text.hook {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    color: var(--cream);
    font-style: italic;
    line-height: 1.4;
  }

  .ad-cta-text {
    display: inline-block;
    margin-top: 4px;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--gold);
    letter-spacing: 0.05em;
  }

  .loading-pulse {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 8px 0;
  }

  .loading-pulse span {
    width: 5px;
    height: 5px;
    background: var(--gold);
    border-radius: 50%;
    animation: pulse 1.1s infinite;
    opacity: 0.5;
  }

  .loading-pulse span:nth-child(2) { animation-delay: 0.18s; }
  .loading-pulse span:nth-child(3) { animation-delay: 0.36s; }

  @keyframes pulse {
    0%, 80%, 100% { transform: scale(1); opacity: 0.4; }
    40% { transform: scale(1.4); opacity: 1; }
  }

  .copy-row {
    display: flex;
    gap: 8px;
    padding: 12px 18px;
    border-top: 1px solid rgba(184,172,154,0.07);
    flex-wrap: wrap;
  }

  .copy-btn {
    background: transparent;
    border: 1px solid rgba(184,172,154,0.2);
    border-radius: 4px;
    padding: 5px 12px;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--taupe);
    cursor: pointer;
    font-family: 'Jost', sans-serif;
    transition: all 0.2s;
  }

  .copy-btn:hover { background: rgba(196,160,106,0.1); color: var(--gold); border-color: var(--gold); }
  .copy-btn.copied { color: #6BBF8E; border-color: #6BBF8E; }

  .regen-btn {
    margin-left: auto;
    background: transparent;
    border: 1px solid rgba(184,172,154,0.15);
    border-radius: 4px;
    padding: 5px 12px;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--olive-mid);
    cursor: pointer;
    font-family: 'Jost', sans-serif;
    transition: all 0.2s;
  }

  .regen-btn:hover { color: var(--taupe); border-color: var(--taupe); }

  .empty-state {
    text-align: center;
    padding: 80px 40px;
    color: var(--olive-mid);
  }

  .empty-state p {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem;
    font-style: italic;
    color: rgba(184,172,154,0.3);
    margin-top: 12px;
  }

  .empty-icon {
    font-size: 2.5rem;
    opacity: 0.2;
  }

  @media (max-width: 700px) {
    .controls-grid { grid-template-columns: 1fr; }
    .ads-grid { grid-template-columns: 1fr; }
    header { padding: 16px 20px; }
    .main { padding: 28px 16px 60px; }
    .controls { padding: 20px; }
  }
</style>
</head>
<body>

<header>
  <h1>FSC <span>Ad Creative</span> Engine</h1>
  <div class="header-tag">Feminine Strength Co.</div>
</header>

<div class="main">

  <div class="controls">
    <div class="controls-title">Generate Ad Set</div>
    <div class="controls-grid">
      <div class="ctrl-group">
        <label>Offer</label>
        <select id="offerSelect">
          <option value="all">All Three Offers</option>
          <option value="discovery">Discovery Call</option>
          <option value="fss">FSS Waitlist</option>
          <option value="inperson">In-Person Training</option>
        </select>
      </div>
      <div class="ctrl-group">
        <label>Platform</label>
        <select id="platformSelect">
          <option value="both">Instagram + TikTok</option>
          <option value="instagram">Instagram / Facebook</option>
          <option value="tiktok">TikTok</option>
        </select>
      </div>
      <div class="ctrl-group">
        <label>Tone</label>
        <select id="toneSelect">
          <option value="real-talk">Real Talk</option>
          <option value="empowering">Empowering</option>
          <option value="urgent">Urgency</option>
          <option value="curiosity">Curiosity Hook</option>
        </select>
      </div>
      <button class="generate-btn" id="genBtn" onclick="generateAds()">✦ Generate</button>
    </div>
  </div>

  <div id="output">
    <div class="empty-state">
      <div class="empty-icon">◈</div>
      <p>Describe your avatar. I'll build the ad set.</p>
    </div>
  </div>

</div>

<script>
const SYSTEM_PROMPT = `You are writing paid ad copy for Christin Fisher, certified personal trainer and founder of Feminine Strength Co. She coaches women 35+ in strength training and body recomposition. Her voice is direct, warm, real-talk, occasionally funny. She's 52, trains hard herself, and has spent 10 years coaching women through this season of life. She avoids fluff and toxic positivity.

CRITICAL POSITIONING — this is what makes her different:
- She coaches what she lives. She was in the research spiral herself and found her way out through lifting.
- Women get trapped defining themselves by their age or stage — she helps them stop spiraling and start moving.
- She speaks from 10 years of coaching observation and lived experience — NEVER from clinical or hormone expertise.
- Never use: "hormone-informed", "cycle-synced", "perimenopause programming" or any clinical hormone language.
- DO use: "I coach what I live", "women in the thick of it", "this season of life", "done being defined by your age", "stop fighting your body", "start building it."

Her three offers:
1. DISCOVERY CALL — free 30-min call to explore 1:1 online coaching. Custom monthly programming built around her life, not against it.
2. FEMININE STRENGTH SOCIETY (FSS) — membership waitlist. Monthly programming + community of women moving forward together + Compass app as a daily self-understanding tool. Not a support group — a momentum group.
3. IN-PERSON TRAINING — private studio sessions in South Jersey. Hands-on, real coaching.

Target avatar: Women 35-55 who feel stuck, have tried everything, are tired of being defined by their age or stage, want to build real strength, feel dismissed by mainstream fitness, done with programs that ignore their actual life.

Return ONLY a JSON array. No preamble, no markdown fences. Exact format:
[
  {
    "platform": "Instagram",
    "type": "Feed Ad",
    "offer": "discovery",
    "hook": "hook line here",
    "body": "body copy here",
    "cta": "CTA text here"
  }
]`;

const OFFERS = {
  discovery: { label: "Discovery Call", badge: "1:1 Coaching" },
  fss: { label: "Feminine Strength Society", badge: "Membership" },
  inperson: { label: "In-Person Training", badge: "South Jersey" }
};

async function callClaude(userMsg) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-api-key": "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", "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      system: SYSTEM_PROMPT,
      messages: [{ role: "user", content: userMsg }]
    })
  });
  const data = await res.json();
  return data.content[0].text;
}

function buildPrompt(offer, platform, tone) {
  const offerDesc = offer === 'all'
    ? 'Generate 2 ads for EACH of the three offers (discovery call, FSS waitlist, in-person training) — 6 ads total.'
    : `Generate 3 ads for the ${OFFERS[offer].label} offer.`;

  const platformDesc = platform === 'both'
    ? 'Mix platforms: some Instagram Feed Ads, some Instagram Stories, some TikTok Scripts.'
    : platform === 'instagram'
      ? 'All Instagram/Facebook — mix of Feed Ads and Stories.'
      : 'All TikTok Scripts — conversational, scroll-stopping opening line.';

  const toneMap = {
    'real-talk': 'Direct, no-fluff, calls out the frustration women feel with generic fitness. Slightly edgy.',
    'empowering': 'Warm, uplifting, celebrates what women are capable of at this stage of life.',
    'urgent': 'Creates urgency — limited spots, waitlist filling, now is the time.',
    'curiosity': 'Opens with a counterintuitive statement or question that makes them stop scrolling.'
  };

  return `${offerDesc} ${platformDesc} Tone: ${toneMap[tone]} Write in Christin's voice. For TikTok, format body as a short video script (15-30 sec). For Instagram, write proper ad copy with line breaks. CTAs should be specific and action-driven.`;
}

async function generateAds() {
  const offer = document.getElementById('offerSelect').value;
  const platform = document.getElementById('platformSelect').value;
  const tone = document.getElementById('toneSelect').value;
  const btn = document.getElementById('genBtn');
  const output = document.getElementById('output');

  btn.disabled = true;
  btn.textContent = 'Writing...';

  // Loading state
  output.innerHTML = `
    <div style="padding:60px;text-align:center;color:var(--taupe)">
      <div class="loading-pulse" style="justify-content:center;margin-bottom:16px">
        <span></span><span></span><span></span>
      </div>
      <p style="font-size:0.85rem;letter-spacing:0.1em;text-transform:uppercase;opacity:0.6">Generating your ad set...</p>
    </div>
  `;

  try {
    const prompt = buildPrompt(offer, platform, tone);
    const raw = await callClaude(prompt);

    let ads;
    try {
      const clean = raw.replace(/```json|```/g, '').trim();
      ads = JSON.parse(clean);
    } catch {
      output.innerHTML = `<div style="padding:40px;color:#E07070;text-align:center">Parse error — try regenerating.</div>`;
      return;
    }

    // Group by offer
    const grouped = {};
    ads.forEach(ad => {
      const key = ad.offer || 'general';
      if (!grouped[key]) grouped[key] = [];
      grouped[key].push(ad);
    });

    output.innerHTML = '';

    Object.entries(grouped).forEach(([offerKey, adList], gi) => {
      const offerInfo = OFFERS[offerKey] || { label: offerKey, badge: 'Ad' };
      const section = document.createElement('div');
      section.className = 'offer-section';

      const heading = document.createElement('div');
      heading.className = 'offer-heading';
      heading.innerHTML = `
        <div class="offer-badge">${offerInfo.badge}</div>
        <h2>${offerInfo.label}</h2>
        <span class="platform-label">${adList.length} ad${adList.length !== 1 ? 's' : ''}</span>
      `;
      section.appendChild(heading);

      const grid = document.createElement('div');
      grid.className = 'ads-grid';

      adList.forEach((ad, i) => {
        const card = document.createElement('div');
        card.className = 'ad-card';
        card.dataset.ad = JSON.stringify(ad);

        card.innerHTML = `
          <div class="ad-card-header">
            <span class="ad-platform">${ad.platform || 'Instagram'}</span>
            <span class="ad-type">${ad.type || 'Feed Ad'}</span>
          </div>
          <div class="ad-body">
            <div class="ad-section-label">Hook</div>
            <div class="ad-text hook">${ad.hook || ''}</div>
            <div class="ad-section-label">Body Copy</div>
            <div class="ad-text">${(ad.body || '').replace(/\n/g, '<br>')}</div>
            <div class="ad-section-label">CTA</div>
            <div class="ad-cta-text">→ ${ad.cta || ''}</div>
          </div>
          <div class="copy-row">
            <button class="copy-btn" onclick="copyAd(this, 'hook')">Copy Hook</button>
            <button class="copy-btn" onclick="copyAd(this, 'body')">Copy Body</button>
            <button class="copy-btn" onclick="copyAd(this, 'full')">Copy All</button>
            <button class="regen-btn" onclick="regenAd(this, '${offerKey}', '${ad.platform}', '${ad.type}')">↻ Regen</button>
          </div>
        `;

        setTimeout(() => card.classList.add('visible'), (gi * 200) + (i * 80));
        grid.appendChild(card);
      });

      section.appendChild(grid);
      output.appendChild(section);
    });

  } catch (err) {
    output.innerHTML = `<div style="padding:40px;color:#E07070;text-align:center">Something went wrong — try again.</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '✦ Generate';
  }
}

async function regenAd(btn, offerKey, platform, type) {
  const card = btn.closest('.ad-card');
  const body = card.querySelector('.ad-body');
  body.innerHTML = `<div class="loading-pulse" style="justify-content:center;padding:24px"><span></span><span></span><span></span></div>`;
  btn.disabled = true;

  const tone = document.getElementById('toneSelect').value;
  const toneMap = {
    'real-talk': 'Direct, no-fluff, real-talk.',
    'empowering': 'Warm and empowering.',
    'urgent': 'Urgency-driven.',
    'curiosity': 'Curiosity hook.'
  };

  const prompt = `Write ONE ${type} ad for ${platform} for Christin's ${OFFERS[offerKey]?.label || offerKey} offer. Tone: ${toneMap[tone]} Return a single JSON object (not array): {"platform":"...","type":"...","offer":"${offerKey}","hook":"...","body":"...","cta":"..."}`;

  try {
    const raw = await callClaude(prompt);
    const clean = raw.replace(/```json|```/g, '').trim();
    const ad = JSON.parse(clean);

    body.innerHTML = `
      <div class="ad-section-label">Hook</div>
      <div class="ad-text hook">${ad.hook || ''}</div>
      <div class="ad-section-label">Body Copy</div>
      <div class="ad-text">${(ad.body || '').replace(/\n/g, '<br>')}</div>
      <div class="ad-section-label">CTA</div>
      <div class="ad-cta-text">→ ${ad.cta || ''}</div>
    `;
    card.dataset.ad = JSON.stringify(ad);
  } catch {
    body.innerHTML = `<div style="color:#E07070;padding:16px;font-size:0.85rem">Error — try again.</div>`;
  }
  btn.disabled = false;
}

function copyAd(btn, part) {
  const card = btn.closest('.ad-card');
  let ad;
  try { ad = JSON.parse(card.dataset.ad); } catch { return; }

  let text = '';
  if (part === 'hook') text = ad.hook || '';
  else if (part === 'body') text = ad.body || '';
  else text = `${ad.hook}\n\n${ad.body}\n\n${ad.cta}`;

  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = '✓ Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1800);
  });
}
</script>
</body>
</html>
